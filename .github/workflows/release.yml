name: Build & Release Packages (Linux DEB/RPM/Arch, macOS, Windows, Docker)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build .deb and portable .tar.gz packages
        run: |
          chmod +x packaging/build-packages.sh
          ./packaging/build-packages.sh

      - name: Build Python Wheel & sdist
        run: |
          python3 -m pip install --upgrade build
          python3 -m build --outdir dist/

      - name: Build Windows ZIP Bundle
        run: |
          zip -r dist/megarac-commander-1.0.0-windows.zip \
            index.html bridge_server.py ModernJViewerBridge.java \
            packaging/windows/install-windows.ps1 README.md LICENSE

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: megarac-commander-packages
          path: dist/*

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
